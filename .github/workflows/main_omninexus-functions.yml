name: Build and deploy Python project to Azure Flex Function App - omninexus-functions

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: '.' # Ensures it targets the root directory where host.json lives
  PYTHON_VERSION: '3.11'              # Matches your portal configuration runtime

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python version
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Create and start virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Explicitly package only the vital runtime files to avoid zipping the whole git history
      - name: Zip artifact for deployment
        run: |
          zip -r release.zip . -x "*.git*" "*venv*"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write 
      contents: read 

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_9A7A39074D9C4FC6BF1EB160AF1D989D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_6315B78140B24324A770EAF8ABB74E3B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A6F6CDAAFD204593938C9F857C94FC3D }}

      - name: 'Deploy to Azure Functions'
        uses: Azure/functions-action@v1
        id: deploy-to-function
        with:
          app-name: 'omninexus-functions'
          slot-name: 'Production'
          package: 'release.zip'  # Pass the explicit zip bundle directly
